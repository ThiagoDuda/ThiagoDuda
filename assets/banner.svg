<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 320" width="1000" height="320" role="img" aria-labelledby="t d">
  <title id="t">Hola, soy Thiago Duda</title>
  <desc id="d">Banner animado: el nombre se revela con un barrido, una línea de acento crece debajo y una luz recorre las letras. A la derecha, anillos orbitando.</desc>
  <style>
    :root { --bg:#0b0f14; --fg:#e6edf3; --mut:#8b98a5; --acc:#2dd4bf; --line:#1b2632; }
    @media (prefers-color-scheme: light) {
      :root { --bg:#f6f8fa; --fg:#0b1220; --mut:#4b5563; --acc:#0f766e; --line:#d0d7de; }
    }
    .bg { fill: var(--bg); }
    .grid { stroke: var(--line); stroke-width: 1; }
    .name { fill: var(--fg); font: 700 92px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; }
    .shine { font: 700 92px ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; letter-spacing: -3px; fill: url(#sweep); }
    .acc { fill: var(--acc); }
    .sub { fill: var(--mut); font: 400 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .ring { fill: none; stroke: var(--acc); }

    /* Entrada del saludo */
    .hello { opacity: 0; animation: rise .8s cubic-bezier(.16,1,.3,1) .1s forwards; }
    @keyframes rise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

    /* Barrido que revela el nombre */
    .wipe { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: wipe 1.1s cubic-bezier(.65,0,.35,1) .45s forwards; }
    @keyframes wipe { to { transform: scaleX(1); } }

    /* Línea de acento que crece bajo el nombre */
    .bar { transform-box: fill-box; transform-origin: left center; transform: scaleX(0); animation: wipe .9s cubic-bezier(.16,1,.3,1) 1.5s forwards; }

    /* Anillos */
    .spin-a { transform-origin: 800px 160px; animation: spin 40s linear infinite; }
    .spin-b { transform-origin: 800px 160px; animation: spin 26s linear infinite reverse; }
    .spin-c { transform-origin: 800px 160px; animation: spin 16s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .pulse { transform-origin: 800px 160px; animation: pulse 3.2s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.18); opacity: .5; } }
    .scan { animation: scan 7s ease-in-out infinite; }
    @keyframes scan { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: .5; } 85% { opacity: .5; } 100% { transform: translateY(380px); opacity: 0; } }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
      .hello { opacity: 1; } .wipe, .bar { transform: none; } .shine { display: none; }
    }
  </style>

  <defs>
    <pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" class="grid"/>
    </pattern>
    <radialGradient id="glow" cx="800" cy="160" r="260" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="var(--acc)" stop-opacity=".22"/>
      <stop offset="1" stop-color="var(--acc)" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scanG" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="var(--acc)" stop-opacity="0"/>
      <stop offset="1" stop-color="var(--acc)" stop-opacity=".35"/>
    </linearGradient>
    <!-- Luz que recorre el nombre -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="var(--acc)" stop-opacity="0"/>
      <stop offset=".5" stop-color="var(--acc)" stop-opacity=".95"/>
      <stop offset="1" stop-color="var(--acc)" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-200 0; -200 0; 700 0; 700 0" keyTimes="0; .3; .7; 1" dur="5s" begin="1.8s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="reveal">
      <rect class="wipe" x="0" y="100" width="640" height="130"/>
    </clipPath>
  </defs>

  <rect class="bg" width="1000" height="320" rx="16"/>
  <rect width="1000" height="320" rx="16" fill="url(#g)" opacity=".7"/>
  <rect width="1000" height="320" rx="16" fill="url(#glow)"/>
  <rect class="scan" x="0" y="-60" width="1000" height="60" fill="url(#scanG)"/>

  <!-- Anillos orbitando -->
  <g>
    <circle class="ring" cx="800" cy="160" r="118" stroke-opacity=".25"/>
    <g class="spin-a">
      <circle class="ring" cx="800" cy="160" r="118" stroke-width="2" stroke-dasharray="2 14" stroke-linecap="round"/>
      <circle class="acc" cx="918" cy="160" r="6"/>
    </g>
    <g class="spin-b">
      <circle class="ring" cx="800" cy="160" r="84" stroke-width="1.5" stroke-dasharray="60 24" stroke-opacity=".7"/>
      <circle class="acc" cx="800" cy="76" r="4.5"/>
    </g>
    <g class="spin-c">
      <circle class="ring" cx="800" cy="160" r="50" stroke-width="1.5" stroke-dasharray="4 10" stroke-opacity=".9"/>
      <circle class="acc" cx="850" cy="160" r="3.5"/>
    </g>
    <circle class="acc pulse" cx="800" cy="160" r="14"/>
    <circle cx="800" cy="160" r="5" class="bg"/>
  </g>

  <!-- Texto -->
  <g transform="translate(56 0)">
    <text class="sub hello" x="0" y="112">Hola, soy</text>
    <g clip-path="url(#reveal)">
      <text class="name" x="-4" y="200">Thiago Duda<tspan class="acc">.</tspan></text>
      <text class="shine" x="-4" y="200">Thiago Duda.</text>
    </g>
    <rect class="acc bar" x="0" y="228" width="120" height="5" rx="2.5"/>
  </g>
</svg>
